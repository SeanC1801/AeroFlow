<script>
/* ==== Inlined state.js + board.js, with the API replaced by a local store ==== */
const COLORS = ["lime", "sunny", "aqua", "pink"];

// --- Local state (single source of truth). Mirrors the server's in-memory dict. ---
const BoardState = {
  tasks: new Map(),
  _nextId: 1,
  seed(list) { list.forEach((t) => this.create(t)); },
  create(t) { const id = this._nextId++; const task = { id, project_code: "DEMO-123", ...t };
              this.tasks.set(id, task); return task; },
  get(id) { return this.tasks.get(id); },
  update(id, changes) { const task = { ...this.tasks.get(id), ...changes }; this.tasks.set(id, task); return task; },
  byStatus(s) { return [...this.tasks.values()].filter((t) => t.status === s); },
};

BoardState.seed([
  { title: "Create new glassmorphism icons for dashboard", username: "Jane Doe", assignee_initials: "JD", color: "sunny", status: "todo" },
  { title: "Fix responsive layout on mobile Nav", username: "Mika K.", assignee_initials: "MK", color: "pink", status: "todo" },
  { title: "Implement WebGL shader backgrounds", username: "Alex L.", assignee_initials: "AL", color: "aqua", status: "in_progress" },
  { title: "Update typography tokens", username: "Mika K.", assignee_initials: "MK", color: "lime", status: "done" },
]);

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function dotColor(c) { return { lime: "#b6ff6b", sunny: "#ffeb6b", aqua: "#6bf5ff", pink: "#ffa1e8" }[c]; }

function cardHTML(task) {
  const dots = COLORS.map((c) =>
    `<span class="color-dot ${c === task.color ? "selected" : ""}" data-color="${c}" style="background:${dotColor(c)}"></span>`).join("");
  return `
    <div class="card-container sticky-${task.color}" data-id="${task.id}">
      <div class="card-inner">
        <div class="card-face card-face--front">
          <div class="card-face__surface">
            <div class="p-4 relative">
              <div class="avatar-badge">${esc(task.assignee_initials)}</div>
              <h3 class="font-label-sm text-[14px] font-bold text-on-surface leading-tight pr-8 js-title">${esc(task.title)}</h3>
              <p class="text-[11px] text-on-surface-variant mt-1 js-username">${esc(task.username)}</p>
            </div>
            <div class="card-toolbar">
              <span class="material-symbols-outlined" data-action="flip" title="Edit">edit</span>
              <span class="material-symbols-outlined" data-action="flip" title="Flip">360</span>
            </div>
          </div>
        </div>
        <div class="card-face card-face--back">
          <div class="card-face__surface">
            <div class="p-3 flex flex-col gap-2 flex-1 overflow-y-auto">
              <label class="text-[10px] font-bold opacity-70">Title</label>
              <input class="edit-field js-edit-title" value="${esc(task.title)}">
              <label class="text-[10px] font-bold opacity-70">Username</label>
              <input class="edit-field js-edit-username" value="${esc(task.username)}">
              <label class="text-[10px] font-bold opacity-70">Initials</label>
              <input class="edit-field js-edit-initials" maxlength="3" value="${esc(task.assignee_initials)}">
              <label class="text-[10px] font-bold opacity-70">Color</label>
              <div class="flex gap-2">${dots}</div>
            </div>
            <div class="card-toolbar">
              <span class="material-symbols-outlined" data-action="cancel" title="Cancel">undo</span>
              <button class="btn-save" data-action="save">Save / Done</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function render() {
  for (const status of ["todo", "in_progress", "done", "approved"]) {
    const col = document.querySelector(`[data-status="${status}"]`);
    const tasks = BoardState.byStatus(status);
    col.innerHTML = tasks.map(cardHTML).join("");
    document.querySelector(`[data-count="${status}"]`).textContent = tasks.length;
  }
}

function populateForm(container, task) {
  container.querySelector(".js-edit-title").value = task.title;
  container.querySelector(".js-edit-username").value = task.username;
  container.querySelector(".js-edit-initials").value = task.assignee_initials;
  container.querySelectorAll(".color-dot").forEach((d) => d.classList.toggle("selected", d.dataset.color === task.color));
}
function applyColorClass(container, color) {
  COLORS.forEach((c) => container.classList.remove(`sticky-${c}`));
  container.classList.add(`sticky-${color}`);
}
function flipToBack(container) { populateForm(container, BoardState.get(Number(container.dataset.id))); container.classList.add("is-flipped"); }
function flipToFront(container) { container.classList.remove("is-flipped"); }

function saveCard(container) {
  const id = Number(container.dataset.id);
  const dot = container.querySelector(".color-dot.selected");
  const updated = BoardState.update(id, {
    title: container.querySelector(".js-edit-title").value.trim(),
    username: container.querySelector(".js-edit-username").value.trim(),
    assignee_initials: container.querySelector(".js-edit-initials").value.trim(),
    color: dot ? dot.dataset.color : BoardState.get(id).color,
  });
  container.querySelector(".js-title").textContent = updated.title;
  container.querySelector(".js-username").textContent = updated.username;
  container.querySelector(".avatar-badge").textContent = updated.assignee_initials;
  applyColorClass(container, updated.color);
  flipToFront(container);
}
function cancelCard(container) { populateForm(container, BoardState.get(Number(container.dataset.id))); flipToFront(container); }

function onBoardClick(evt) {
  const container = evt.target.closest(".card-container");
  if (!container) return;
  const dot = evt.target.closest(".color-dot");
  if (dot) {
    container.querySelectorAll(".color-dot").forEach((d) => d.classList.remove("selected"));
    dot.classList.add("selected");
    return;
  }
  const actionEl = evt.target.closest("[data-action]");
  if (!actionEl) return;
  if (actionEl.dataset.action === "flip") flipToBack(container);
  else if (actionEl.dataset.action === "save") saveCard(container);
  else if (actionEl.dataset.action === "cancel") cancelCard(container);
}

function addTask() {
  BoardState.create({ title: "New task", username: "Unassigned", assignee_initials: "??", color: "aqua", status: "todo" });
  render();
}

const board = document.querySelector(".grid");
board.addEventListener("click", onBoardClick);
board.addEventListener("mousedown", (e) => { if (e.target.closest(".edit-field")) e.stopPropagation(); });
document.getElementById("add-task-btn").addEventListener("click", addTask);
render();
</script>
